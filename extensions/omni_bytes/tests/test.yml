$schema: "https://raw.githubusercontent.com/omnigres/omnigres/master/pg_yregress/schema.json"
instance:
  init:
  - create extension omni_bytes cascade
  - set search_path to omni_bytes, pg_catalog, '$user', public
  - |
    -- Test data setup
    create table test_data (
        name text primary key,
        data bytea,
        description text
    )
#  - |
#    insert into test_data values
#    ('empty', ''::bytea, 'Empty bytea'),
#    ('single_byte', '\x41'::bytea, 'Single ASCII byte (A)'),
#    ('hello_world', 'Hello World!'::bytea, 'Simple ASCII text'),
#    ('mixed_binary', (E'\x89\x50\x4E\x47' || E'\r\n\x1a\n' || 'Hello' || E'\x00' || 'World')::bytea, 'Mixed binary and text'),
#    ('utf8_simple', ('Caf' || E'\xc3\xa9')::bytea, 'Simple UTF-8 (café)'),
#    ('utf8_complex', ('Hello ' || E'\xf0\x9f\x8c\x8d' || ' World!')::bytea, 'UTF-8 with emoji'),
#    ('control_chars', ('Line1' || E'\n' || 'Line2' || E'\r\n' || 'Line3' || E'\x00' || 'End')::bytea, 'Control characters'),
#    ('high_bytes', E'\xff\xfe\xfd\xfc\x01\x02\x03\x04'::bytea, 'High and low bytes'),
#    ('long_text', repeat('ABCD1234', 20)::bytea, 'Long repeating pattern')

tests:

# to_text() function tests
- name: to_text function
  tests:
  - name: convert simple ASCII text
    query: |
      select to_text('Hello World!'::bytea) as result
    results:
    - result: "Hello World!"

  - name: convert with explicit UTF-8 encoding
    query: |
      select to_text(E'Caf\xc3\xa9'::bytea, 'UTF8') as result
    results:
    - result: "Café"

  - name: convert with default encoding
    query: |
      select to_text('Hello'::bytea) = convert_from('Hello'::bytea, getdatabaseencoding()) as same_as_default
    results:
    - same_as_default: true

  - name: handle empty bytea
    query: |
      select to_text(''::bytea) as result
    results:
    - result: ""

  - name: convert with latin1 encoding
    query: |
      select to_text(E'\\xe9'::bytea, 'LATIN1') as result
    results:
    - result: "é"

# to_bytes() function tests
- name: to_bytes function
  tests:
  - name: convert simple ASCII text
    query: |
      select to_bytes('Hello World!') = 'Hello World!'::bytea as result
    results:
    - result: true

  - name: convert UTF-8 text with explicit encoding
    query: |
      select to_bytes('Café', 'UTF8') = E'Caf\xc3\xa9'::bytea as result
    results:
    - result: true

  - name: handle empty string
    query: |
      select to_bytes('') = ''::bytea as result
    results:
    - result: true

# hex_bytes() function tests
- name: hex_bytes function
  tests:
  - name: basic hex conversion
    query: |
      select hex from hex_bytes('ABC'::bytea)
    results:
    - hex: "41 42 43"

  - name: empty bytea returns no rows
    query: |
      select count(*) as row_count from hex_bytes(''::bytea)
    results:
    - row_count: 0

  - name: single byte
    query: |
      select line, hex from hex_bytes('\x41'::bytea)
    results:
    - line: 1
      hex: "41"

  - name: width parameter controls line breaking
    query: |
      select line, hex from hex_bytes('ABCDEF'::bytea, width => 3)
    results:
    - line: 1
      hex: "41 42 43"
    - line: 2
      hex: "44 45 46"

  - name: group_size parameter controls spacing
    query: |
      select hex from hex_bytes('ABCDEF'::bytea, group_size => 2)
    results:
    - hex: "41 42  43 44  45 46"

  - name: custom separators
    query: |
      select hex from hex_bytes('ABCD'::bytea, group_size => 2, byte_separator => '-', group_separator => '|')
    results:
    - hex: "41-42|43-44"

  - name: handles incomplete last line
    query: |
      select line, hex from hex_bytes('ABCDE'::bytea, width => 4)
    results:
    - line: 1
      hex: "41 42 43 44"
    - line: 2
      hex: "45"

  - name: large data multiple lines
    query: |
      select count(*) as line_count, max(line) as max_line
      from hex_bytes(repeat('A', 100)::bytea, width => 16)
    results:
    - line_count: 7
      max_line: 7

  - name: group_size larger than width
    query: |
      select hex from hex_bytes('ABCD'::bytea, width => 4, group_size => 10)
    results:
    - hex: "41 42 43 44"

# bytes_offsets() function tests
- name: bytes_offsets function
  tests:
  - name: basic hex offsets
    query: |
      select line, data_offset from bytes_offsets('Hello World!'::bytea)
    results:
    - line: 1
      data_offset: "00000000"

  - name: empty bytea returns no rows
    query: |
      select count(*) as row_count from bytes_offsets(''::bytea)
    results:
    - row_count: 0

  - name: multiple lines with default width
    query: |
      select line, data_offset 
      from bytes_offsets(repeat('A', 40)::bytea, width => 16)
      order by line
    results:
    - line: 1
      data_offset: "00000000"
    - line: 2
      data_offset: "00000010"
    - line: 3
      data_offset: "00000020"

  - name: decimal offsets
    query: |
      select line, data_offset 
      from bytes_offsets('Hello World!'::bytea, hex => false)
    results:
    - line: 1
      data_offset: "00000000"

  - name: custom length and padding
    query: |
      select data_offset from bytes_offsets('Hello'::bytea, length => 4, padding => 'X')
    results:
    - data_offset: "XXX0"

  - name: decimal with large offset
    query: |
      select line, data_offset
      from bytes_offsets(repeat('A', 200)::bytea, width => 100, hex => false)
      order by line
    results:
    - line: 1
      data_offset: "00000000"
    - line: 2
      data_offset: "00000100"

  - name: hex with large offset
    query: |
      select line, data_offset
      from bytes_offsets(repeat('A', 512)::bytea, width => 256)
      order by line
    results:
    - line: 1
      data_offset: "00000000"
    - line: 2
      data_offset: "00000100"

# ascii_bytes() function tests
- name: ascii_bytes function
  tests:
  - name: basic ASCII conversion
    query: |
      select ascii from ascii_bytes('Hello World!'::bytea)
    results:
    - ascii: "Hello World!"

  - name: empty bytea returns no rows
    query: |
      select count(*) as row_count from ascii_bytes(''::bytea)
    results:
    - row_count: 0

  - name: control characters become dots
    query: |
      select ascii from ascii_bytes(E'Hello\\x00\\x01\\x1World'::bytea)
    results:
    - ascii: "Hello...World"

  - name: high bytes become dots
    query: |
      select ascii from ascii_bytes(E'\\xff\\xfe\\x80Test'::bytea)
    results:
    - ascii: "...Test"

  - name: width parameter controls line breaking
    query: |
      select line, ascii from ascii_bytes('Hello World!'::bytea, width => 5)
      order by line
    results:
    - line: 1
      ascii: "Hello"
    - line: 2
      ascii: " Worl"
    - line: 3
      ascii: "d!"

  - name: mixed printable and non-printable
    query: |
      select ascii from ascii_bytes(E'ABC\\x00DEF\\xff'::bytea)
    results:
    - ascii: "ABC.DEF."

  - name: boundary ASCII values
    query: |
      select ascii from ascii_bytes(E'\\x1f \\x7e\\x7f'::bytea)
    results:
    - ascii: ". ~."

  - name: UTF-8 bytes show as individual bytes
    query: |
      select ascii from ascii_bytes(E'Caf\\xc3\\xa9'::bytea)
    results:
    - ascii: "Caf.."


